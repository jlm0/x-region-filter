name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:performance
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-and-test-results
          path: |
            dist/
            test-results/
